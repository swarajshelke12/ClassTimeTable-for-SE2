<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SE2 Timetable | Computer Engineering</title>
  <meta name="description" content="Simple, fast and mobile-friendly timetable for SE2 Computer Engineering students." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    /* =========================================================
       CSS VARIABLES & THEME TOKENS
       ========================================================= */
    :root {
      --bg-app: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-surface-elevated: #FFFFFF;
      --bg-muted: #F1F5F9;
      --bg-hover: #E2E8F0;
      
      --border-subtle: #E2E8F0;
      --border-strong: #CBD5E1;
      
      --text-main: #0F172A;
      --text-muted: #475569;
      --text-dim: #94A3B8;
      
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --primary-glow: rgba(79, 70, 229, 0.15);
      
      --status-live-bg: #ECFDF5;
      --status-live-text: #059669;
      --status-live-border: #A7F3D0;
      
      --status-next-bg: #FFFBEB;
      --status-next-text: #D97706;
      --status-next-border: #FDE68A;
      
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 14px -2px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.1);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
    }

    /* =========================================================
       BASE & RESET
       ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px 14px 40px;
      line-height: 1.5;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .app-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* =========================================================
       HEADER
       ========================================================= */
    .header {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-badge {
      background: var(--primary);
      color: #FFF;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      letter-spacing: 0.05em;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    .header-info h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .header-info p {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* =========================================================
       BATCH SELECTOR PILLS
       ========================================================= */
    .batch-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
    }

    .batch-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .batch-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }

    .batch-active-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }

    .batch-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .batch-scroll::-webkit-scrollbar {
      display: none;
    }

    .batch-pill {
      border: 1px solid var(--border-subtle);
      background: var(--bg-muted);
      color: var(--text-muted);
      padding: 6px 13px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .batch-pill:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .batch-pill.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    /* =========================================================
       VIEW NAVIGATION (DAY / WEEK / DIRECTORY)
       ========================================================= */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg-muted);
      padding: 4px;
      border-radius: var(--radius-md);
      gap: 4px;
    }

    .nav-tab-btn {
      background: transparent;
      border: none;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .nav-tab-btn.active {
      background: var(--bg-surface);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    /* =========================================================
       DAY SWITCHER (MON - FRI)
       ========================================================= */
    .day-switcher {
      display: flex;
      gap: 6px;
      background: var(--bg-surface);
      padding: 8px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .day-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 4px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .day-btn .day-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: transparent;
    }

    .day-btn.is-today .day-dot {
      background: var(--primary);
    }

    .day-btn:hover {
      background: var(--bg-muted);
      color: var(--text-main);
    }

    .day-btn.active {
      background: var(--primary);
      color: #FFFFFF;
    }

    .day-btn.active .day-dot {
      background: #FFFFFF;
    }

    /* =========================================================
       TIMELINE / LECTURE CARDS
       ========================================================= */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .break-card {
      background: var(--bg-surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .break-card span.break-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lecture-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .lecture-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--subject-color, var(--primary));
    }

    .lecture-card.live-now {
      border-color: var(--status-live-border);
      background: var(--status-live-bg);
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.12);
    }

    .lecture-card.up-next {
      border-color: var(--status-next-border);
      background: var(--status-next-bg);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .time-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--bg-muted);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-badge.live {
      background: var(--status-live-bg);
      color: var(--status-live-text);
      border: 1px solid var(--status-live-border);
    }

    .status-badge.live .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    .status-badge.next {
      background: var(--status-next-bg);
      color: var(--status-next-text);
      border: 1px solid var(--status-next-border);
    }

    .card-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-subject-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-subject-code {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-type-tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      color: #FFF;
      background: var(--subject-color, var(--primary));
      text-transform: uppercase;
    }

    .card-subject-name {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .card-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.78rem;
    }

    .card-prof {
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-room-badge {
      background: var(--bg-muted);
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.74rem;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* ALL BATCHES MATRIX CARDS */
    .practical-matrix {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 6px;
      margin-top: 6px;
    }

    .matrix-item {
      background: var(--bg-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
      border-left: 3px solid var(--matrix-color, #64748B);
    }

    .matrix-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .matrix-batch {
      font-weight: 800;
      font-size: 0.74rem;
      color: var(--primary);
    }

    .matrix-room {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-dim);
    }

    .matrix-subject {
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--text-main);
    }

    .matrix-prof {
      font-size: 0.68rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================================================
       WEEK VIEW (GRID)
       ========================================================= */
    .week-view-wrapper {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    .week-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 6px;
      min-width: 480px;
    }

    .week-table th {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      padding: 6px 4px;
      text-align: center;
    }

    .week-table th.is-today-col {
      color: var(--primary);
    }

    .week-table td {
      vertical-align: top;
      padding: 0;
    }

    .week-time-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-dim);
      text-align: center;
      padding: 8px 4px !important;
      white-space: nowrap;
    }

    .week-cell {
      background: var(--bg-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px;
      height: 100%;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: all 0.15s ease;
      border-left: 3px solid var(--cell-color, #64748B);
    }

    .week-cell.is-today {
      background: var(--primary-light);
    }

    .week-cell-code {
      font-weight: 800;
      font-size: 0.76rem;
      color: var(--text-main);
    }

    .week-cell-room {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .week-cell-break {
      text-align: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-dim);
      padding: 4px;
      background: var(--bg-surface);
      border: 1px dashed var(--border-subtle);
      border-radius: var(--radius-sm);
    }

    /* =========================================================
       DIRECTORY / ASSISTANT TAB
       ========================================================= */
    .directory-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .directory-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .directory-title {
      font-size: 0.9rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .directory-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .directory-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg-muted);
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
    }

    .directory-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .directory-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--item-color, var(--primary));
    }

    .directory-code {
      font-weight: 800;
      color: var(--text-main);
      min-width: 50px;
    }

    .directory-name {
      color: var(--text-muted);
      font-weight: 500;
    }

    .directory-prof {
      font-weight: 600;
      color: var(--text-main);
      text-align: right;
      font-size: 0.74rem;
    }

    /* =========================================================
       ASSISTANT CHAT
       ========================================================= */
    .assistant-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
    }

    .chat-messages-wrap {
      padding: 14px;
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-bubble {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      line-height: 1.45;
      max-width: 85%;
    }

    .chat-bubble.bot {
      background: var(--bg-muted);
      color: var(--text-main);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .chat-bubble.user {
      background: var(--primary);
      color: #FFFFFF;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .chat-quick-buttons {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      overflow-x: auto;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      scrollbar-width: none;
    }

    .chat-quick-buttons::-webkit-scrollbar {
      display: none;
    }

    .quick-btn {
      background: var(--bg-muted);
      border: 1px solid var(--border-subtle);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .quick-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .chat-input-bar {
      display: flex;
      padding: 10px 14px;
      border-top: 1px solid var(--border-subtle);
      gap: 8px;
      background: var(--bg-surface);
    }

    .chat-input-bar input {
      flex: 1;
      border: 1px solid var(--border-subtle);
      background: var(--bg-muted);
      padding: 8px 12px;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-size: 0.82rem;
      color: var(--text-main);
      outline: none;
    }

    .chat-input-bar input:focus {
      border-color: var(--primary);
    }

    .chat-send-btn {
      background: var(--primary);
      border: none;
      color: #FFF;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* =========================================================
       FOOTER
       ========================================================= */
    .app-footer {
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-dim);
      padding: 16px 8px 8px;
      margin-top: auto;
    }

    /* EMPTY STATE */
    .empty-state {
      background: var(--bg-surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 36px 20px;
      text-align: center;
    }

    .empty-state h3 {
      font-size: 1rem;
      margin: 8px 0 4px;
      color: var(--text-main);
    }

    .empty-state p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- HEADER -->
    <header class="header">
      <div class="header-brand">
        <div class="header-badge">SE2</div>
        <div class="header-info">
          <h1>Class Timetable</h1>
          <p id="headerDateStr">Second Year • Computer Engineering</p>
        </div>
      </div>
    </header>

    <!-- BATCH SELECTOR -->
    <section class="batch-section">
      <div class="batch-header">
        <span class="batch-title">Select Batch</span>
        <span class="batch-active-badge" id="activeBatchDisplay">Batch: ALL</span>
      </div>
      <div class="batch-scroll" id="batchPills">
        <button class="batch-pill active" data-batch="ALL" onclick="selectBatch('ALL')">ALL</button>
        <button class="batch-pill" data-batch="A1" onclick="selectBatch('A1')">A1</button>
        <button class="batch-pill" data-batch="A2" onclick="selectBatch('A2')">A2</button>
        <button class="batch-pill" data-batch="A3" onclick="selectBatch('A3')">A3</button>
        <button class="batch-pill" data-batch="B1" onclick="selectBatch('B1')">B1</button>
        <button class="batch-pill" data-batch="B2" onclick="selectBatch('B2')">B2</button>
        <button class="batch-pill" data-batch="B3" onclick="selectBatch('B3')">B3</button>
        <button class="batch-pill" data-batch="C1" onclick="selectBatch('C1')">C1</button>
        <button class="batch-pill" data-batch="C2" onclick="selectBatch('C2')">C2</button>
        <button class="batch-pill" data-batch="C3" onclick="selectBatch('C3')">C3</button>
      </div>
    </section>

    <!-- VIEW TABS -->
    <nav class="nav-tabs">
      <button class="nav-tab-btn active" id="tabDayBtn" onclick="switchView('day')">
        <span>📅</span> Daily Schedule
      </button>
      <button class="nav-tab-btn" id="tabWeekBtn" onclick="switchView('week')">
        <span>📊</span> Weekly Grid
      </button>
      <button class="nav-tab-btn" id="tabInfoBtn" onclick="switchView('info')">
        <span>💬</span> Faculty & Q&A
      </button>
    </nav>

    <!-- VIEW: DAY SCHEDULE -->
    <main id="dayView">
      <!-- DAY SWITCHER -->
      <div class="day-switcher" id="daySwitcher">

    function renderDayTimeline() {
      const container = document.getElementById("timelineContainer");
      const dayData = SE2_SCHEDULE[selectedDay];
      const todayNum = new Date().getDay();
      const isViewingToday = (selectedDay === todayNum);
      const nowMin = getNowMin();

      if (!dayData) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size:2rem;">🎉</div>
            <h3>No classes scheduled</h3>
            <p>Enjoy your break!</p>
          </div>`;
        return;
      }

      let html = "";
      let processedCombined = {};

      SLOTS.forEach(slot => {
        // Render Break Slot
        if (slot.isBreak) {
          html += `
            <div class="break-card">
              <span class="break-title">☕ ${slot.label}</span>
              <span class="time-badge">${slot.time}</span>
            </div>`;
          return;
        }

        const slotId = slot.id;

        // Handle 2-hour Combined Practical (3-4 or 5-6)
        if (slotId === 3 && dayData["3-4"]) {
          html += renderSlotItem(dayData["3-4"], { start: "11:15", end: "13:15", startMin: 675, endMin: 795, timeLabel: "11:15 AM - 01:15 PM" }, isViewingToday, nowMin);
          processedCombined[3] = true;
          processedCombined[4] = true;
          return;
        }
        if (slotId === 4 && processedCombined[4]) return;

        if (slotId === 5 && dayData["5-6"]) {
          html += renderSlotItem(dayData["5-6"], { start: "13:45", end: "15:45", startMin: 825, endMin: 945, timeLabel: "01:45 PM - 03:45 PM" }, isViewingToday, nowMin);
          processedCombined[5] = true;
          processedCombined[6] = true;
          return;
        }
        if (slotId === 6 && processedCombined[6]) return;

        // Render Normal 1-Hour Theory Slot
        const entry = dayData[slotId];
        if (entry) {
          html += renderSlotItem(entry, { start: slot.start, end: slot.end, startMin: slot.startMin, endMin: slot.endMin, timeLabel: slot.label }, isViewingToday, nowMin);
        }
      });

      container.innerHTML = html;
    }

    function renderSlotItem(item, timing, isToday, nowMin) {

        statusHtml = `<span class="status-badge next">⏳ Up Next • in ${until}m</span>`;

                  <span class="matrix-room">${alloc.room}</span>
                </div>
                <div class="matrix-subject">${alloc.code}</div>
                <div class="matrix-prof">${alloc.prof}</div>
              </div>`;
          });
          matrixHtml += `</div>`;

          return `
            <div class="${cardClass}" style="--subject-color: #10B981;">
              <div class="card-top">
                <span class="time-badge">${timing.timeLabel}</span>
                ${statusHtml}
              </div>
              <div class="card-main">
                <div class="card-subject-row">
                  <span class="card-subject-code">🔬 Practical Labs</span>
                  <span class="card-type-tag">All Batches</span>
                </div>
                <div class="card-subject-name">Batch Allocations (A1 - C3)</div>
                ${matrixHtml}
              </div>
            </div>`;
        } else {
          // Show Single Batch Specific Practical
          const alloc = item.batches[currentBatch] || { code: "Library", prof: "Self-Study", room: "Library", color: "#64748B" };
          const isLib = alloc.code.toLowerCase().includes("library");
          return `
            <div class="${cardClass}" style="--subject-color: ${alloc.color};">
              <div class="card-top">
                <span class="time-badge">${timing.timeLabel}</span>
                ${statusHtml}
              </div>
              <div class="card-main">
                <div class="card-subject-row">
                  <span class="card-subject-code">${alloc.code}</span>
                  <span class="card-type-tag" style="background:${alloc.color}">Batch ${currentBatch}</span>
                </div>
                <div class="card-subject-name">${isLib ? "Self-Study Period" : "Lab Session"}</div>
              </div>
              <div class="card-footer">
                <span class="card-prof">👨‍🏫 ${alloc.prof}</span>
                <span class="card-room-badge">${isLib ? '📚' : '🔬'} ${alloc.room}</span>
              </div>
            </div>`;
        }
      }

      // 2. Theory Lecture
      return `
        <div class="${cardClass}" style="--subject-color: ${item.color};">
          <div class="card-top">
            <span class="time-badge">${timing.timeLabel}</span>
            ${statusHtml}
          </div>
          <div class="card-main">
            <div class="card-subject-row">
              <span class="card-subject-code">${item.code}</span>
              <span class="card-type-tag" style="background:${item.color}">Theory</span>
            </div>
            <div class="card-subject-name">${item.name}</div>
          </div>
          <div class="card-footer">
            <span class="card-prof">👨‍🏫 ${item.prof}</span>
            <span class="card-room-badge">📍 ${item.room}</span>
          </div>
        </div>`;
    }

    // 10. RENDER WEEKLY GRID
    function renderWeekGrid() {
      const table = document.getElementById("weekTable");
      const todayNum = new Date().getDay();
      const weekDays = [1, 2, 3, 4, 5];

      let headerHtml = `<thead><tr><th style="width:70px;">Time</th>`;
      weekDays.forEach(d => {
        const isToday = (d === todayNum);
        headerHtml += `<th class="${isToday ? 'is-today-col' : ''}">${DAY_SHORT[d]} ${isToday ? '•' : ''}</th>`;
      });
      headerHtml += `</tr></thead>`;

      let bodyHtml = `<tbody>`;

      SLOTS.forEach(slot => {
        if (slot.isBreak) {
          bodyHtml += `
            <tr>
              <td class="week-time-label">Break</td>
              <td colspan="5" class="week-cell-break">☕ ${slot.label} (${slot.time})</td>
            </tr>`;
          return;
        }

        bodyHtml += `<tr>`;
        bodyHtml += `<td class="week-time-label">${slot.start}</td>`;

        weekDays.forEach(d => {
          const dayData = SE2_SCHEDULE[d];
          const isToday = (d === todayNum);
          
          let cellContent = "";
          let color = "#64748B";

          if (dayData) {
            if ((slot.id === 3 || slot.id === 4) && dayData["3-4"]) {
              const practical = dayData["3-4"];
              if (currentBatch === "ALL") {
                cellContent = `<div class="week-cell-code">LABS</div><div class="week-cell-room">A1-C3</div>`;
                color = "#10B981";
              } else {
                const alloc = practical.batches[currentBatch] || { code: "LIB", room: "Library", color: "#64748B" };
                cellContent = `<div class="week-cell-code">${alloc.code}</div><div class="week-cell-room">${alloc.room}</div>`;
                color = alloc.color;
              }
            } else if ((slot.id === 5 || slot.id === 6) && dayData["5-6"]) {
              const practical = dayData["5-6"];
              if (currentBatch === "ALL") {
                cellContent = `<div class="week-cell-code">LABS</div><div class="week-cell-room">A1-C3</div>`;
                color = "#10B981";
              } else {
                const alloc = practical.batches[currentBatch] || { code: "LIB", room: "Library", color: "#64748B" };
                cellContent = `<div class="week-cell-code">${alloc.code}</div><div class="week-cell-room">${alloc.room}</div>`;
                color = alloc.color;
              }
            } else if (dayData[slot.id]) {
              const theory = dayData[slot.id];
              cellContent = `<div class="week-cell-code">${theory.code}</div><div class="week-cell-room">${theory.room}</div>`;
              color = theory.color;
            }
          }

          bodyHtml += `
            <td>
              <div class="week-cell ${isToday ? 'is-today' : ''}" style="--cell-color: ${color}">
                ${cellContent || '<span style="color:var(--text-dim);font-size:0.7rem;">-</span>'}
              </div>
            </td>`;
        });

        bodyHtml += `</tr>`;
      });

      bodyHtml += `</tbody>`;
      table.innerHTML = headerHtml + bodyHtml;
    }

    // 11. RENDER DIRECTORY
    function renderDirectory() {
      const container = document.getElementById("directoryList");
      let html = "";
      for (const key in SUBJECTS) {
        if (key === "LIB") continue;
        const subj = SUBJECTS[key];
        html += `
          <div class="directory-item">
            <div class="directory-item-left">
              <span class="directory-dot" style="--item-color:${subj.color}"></span>
              <div>
                <span class="directory-code">${key}</span>
                <span class="directory-name"> &bull; ${subj.full}</span>
              </div>
            </div>
            <div class="directory-prof">${subj.prof}</div>
          </div>`;
      }
      container.innerHTML = html;
    }

    // 12. CHATBOT ASSISTANT
    function askBot(query) {
      document.getElementById("chatInput").value = query;
      sendChat();
    }

    function addMessage(sender, text) {
      const box = document.getElementById("chatMessages");
      const msg = document.createElement("div");
      msg.className = `chat-bubble ${sender}`;
      msg.innerHTML = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    function sendChat() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;
      addMessage("user", text);
      input.value = "";

      setTimeout(() => {
        const reply = getBotReply(text);
        addMessage("bot", reply);
      }, 150);
    }

    function getBotReply(q) {
      const query = q.toLowerCase();
      const batch = (currentBatch === "ALL" ? "A1" : currentBatch);
      const todayNum = new Date().getDay();

      if (
        query.includes("developer") ||
        query.includes("who built") ||
        query.includes("who made") ||
        query.includes("creator") ||
        query.includes("author") ||
        query.includes("swaraj") ||
        query.includes("social") ||
        query.includes("contact") ||
        query.includes("github") ||
        query.includes("linkedin") ||
        query.includes("instagram") ||
        query.includes("youtube")
      ) {
        return `👨‍💻 <b>Crafted by Swaraj Shelke</b><br>Second Year Computer Engineering • PICT<br><br><b>Connect with me:</b><br>• 🐙 <a href="https://github.com/swarajshelke12" target="_blank" rel="noopener" style="color:var(--primary);font-weight:700;">GitHub</a><br>• 💼 <a href="https://www.linkedin.com/in/swaraj-shelke-0a3a752b8/" target="_blank" rel="noopener" style="color:var(--primary);font-weight:700;">LinkedIn</a><br>• 📸 <a href="https://www.instagram.com/swarajshelke12" target="_blank" rel="noopener" style="color:var(--primary);font-weight:700;">Instagram</a><br>• 📺 <a href="https://www.youtube.com/@swaraj_shelke" target="_blank" rel="noopener" style="color:var(--primary);font-weight:700;">YouTube</a>`;
      }

      if (query.includes("next") || query.includes("upcoming")) {
        if (todayNum === 0 || todayNum === 6) {
          return "🎉 Today is the weekend! No lectures today. Your next lecture is on <b>Monday at 9:00 AM</b> (DS in E202).";
        }
        const nowMin = getNowMin();
        const dayData = SE2_SCHEDULE[todayNum];
        if (!dayData) return "No lectures scheduled.";

        for (const slot of SLOTS) {
          if (slot.isBreak) continue;
          if (nowMin < slot.startMin) {
            let info = "";
            if ((slot.id === 3 || slot.id === 4) && dayData["3-4"]) {
              const alloc = dayData["3-4"].batches[batch];
              info = `<b>${alloc.code}</b> in <b>${alloc.room}</b> (${alloc.prof})`;
            } else if ((slot.id === 5 || slot.id === 6) && dayData["5-6"]) {
              const alloc = dayData["5-6"].batches[batch];
              info = `<b>${alloc.code}</b> in <b>${alloc.room}</b> (${alloc.prof})`;
            } else if (dayData[slot.id]) {
              const t = dayData[slot.id];
              info = `<b>${t.code} (${t.name})</b> in <b>${t.room}</b> with <b>${t.prof}</b>`;
            }
            const inMin = slot.startMin - nowMin;
            return `⏰ <b>Up Next at ${slot.start} (in ${inMin}m):</b><br>${info}`;
          }
        }
        return "🎉 All classes for today have ended! See you tomorrow.";
      }

      if (query.includes("today") || query.includes("schedule")) {
        if (todayNum === 0 || todayNum === 6) return "☕ Today is the weekend! Enjoy your rest.";
        const dayData = SE2_SCHEDULE[todayNum];
        let res = `📅 <b>Today's Schedule (${DAY_NAMES[todayNum]} - Batch ${batch}):</b><br><ul>`;
        SLOTS.forEach(s => {
          if (s.isBreak) {
            res += `<li>☕ <i>${s.label} (${s.time})</i></li>`;
            return;
          }
          if (s.id === 3 && dayData["3-4"]) {
            const a = dayData["3-4"].batches[batch];
            res += `<li><b>11:15 AM - 1:15 PM</b>: ${a.code} (${a.room})</li>`;
          } else if (s.id === 5 && dayData["5-6"]) {
            const a = dayData["5-6"].batches[batch];
            res += `<li><b>01:45 PM - 3:45 PM</b>: ${a.code} (${a.room})</li>`;
          } else if (dayData[s.id]) {
            const t = dayData[s.id];
            res += `<li><b>${s.label}</b>: ${t.code} &ndash; ${t.room}</li>`;
          }
        });
        res += `</ul>`;
        return res;
      }

      if (query.includes("ds")) {
        return "💻 <b>Data Structures (DS / DS Lab):</b><br>• Theory: Mon 9AM (E202), Tue 11:15AM (E202), Fri 10AM (E202)<br>• Faculty: Prof. Alka Kumbhar (AAK), Prof. Nilima Patil, Prof. Smita Sapkal";
      }

      if (query.includes("os") || query.includes("operating")) {
        return "🖥️ <b>Operating Systems (OS):</b><br>• Theory: Mon 10AM, Tue 9AM, Wed 9AM in <b>Room E202</b><br>• Faculty: Prof. Smita Sapkal (SS)";
      }

      if (query.includes("oopcg") || query.includes("graphics")) {
        return "🎨 <b>OOPCG (OOP & Computer Graphics):</b><br>• Theory: Tue 10AM, Wed 10AM, Thu 9AM in <b>Room E202</b><br>• Faculty: Prof. Ashvini Kheole (APK)";
      }

      if (query.includes("deld") || query.includes("digital")) {
        return "⚡ <b>DELD (Digital Electronics & Logic):</b><br>• Theory: Tue 12:15PM, Thu 10AM in <b>Room E202</b><br>• Faculty: Prof. Smita Kathar (SK)";
      }

      if (query.includes("break") || query.includes("lunch")) {
        return "☕ <b>Daily Breaks:</b><br>• <b>Short Break</b>: 11:00 AM &ndash; 11:15 AM<br>• <b>Lunch Break</b>: 01:15 PM &ndash; 01:45 PM";
      }

      if (query.includes("who teaches") || query.includes("prof") || query.includes("teacher")) {
        return "👨‍🏫 <b>Faculty Directory:</b><br>• <b>DS</b>: Prof. Alka Kumbhar (AAK)<br>• <b>OS</b>: Prof. Smita Sapkal (SS)<br>• <b>OOPCG</b>: Prof. Ashvini Kheole (APK)<br>• <b>DELD</b>: Prof. Smita Kathar (SK)<br>• <b>UHV</b>: Prof. Neelam Jadhav (NJ)<br>• <b>DM</b>: Dr. Maya Jadhav (Dr. MJ)<br>• <b>ED</b>: Prof. Nilam Naidu (NN)";
      }

      return "🤖 You can ask me about:<br>• <i>'What is my next class?'</i><br>• <i>'Today\'s schedule'</i><br>• <i>'When is DS / OS / OOPCG?'</i><br>• <i>'Who teaches DELD?'</i><br>• <i>'Break timings'</i>";
    }

    // 12. INITIALIZE
    function init() {
      // Set today's date in header
      const d = new Date();
      const dayName = DAY_NAMES[d.getDay()];
      const dateFormatted = d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
      document.getElementById("headerDateStr").textContent = `${dayName}, ${dateFormatted} • Room E202`;

      // Set initial day button state
      document.querySelectorAll(".day-btn").forEach(btn => {
        const dNum = parseInt(btn.getAttribute("data-day"), 10);
        if (dNum === d.getDay()) {
          btn.classList.add("is-today");
        }
        btn.classList.toggle("active", dNum === selectedDay);
      });

      // Set initial batch button state
      selectBatch(currentBatch);
      renderDirectory();

      // Refresh real-time indicators every 30s
      setInterval(() => {
        renderDayTimeline();
      }, 30000);
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
